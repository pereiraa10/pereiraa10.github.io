  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/Headshot0825-7738.jpg"
    content: |-
      Working at the intersection of computational neuroscience and music technology, I study how music impacts our emotions and interacts with our natural internal rhythms.  

      I use research-backed insights to design machine learning systems for interactive generative music particularly in contexts of wellbeing and music therapy.  

      Before this, I spent 4+ years at Goldman Sachs working in business strategy and financial modeling, developing an intuition for business development and entrepreneurship.  

      As an active musician and producer as well, my creative pursuits inform my approach to building tools that are intuitive and creatively meaningful.  

      **I’m interested in collaborations in music AI, computational neuroscience, and creative technology.**
    skills:
      enable: true
      title: "Technologies & Tools"
      items:
        - "Machine Learning: Pytorch, TensorFlow, scikit-learn"
        - "Audio & MIR: Librosa, Essentia, DSP"
        - "Data Engineering: Python, SQL, Pandas, NumPy"
        - "Creative Tools: LogicPro, GarageBand, MIDI Plug-ins, Melodyne"
        - "Music: Piano, Voice, Ukulele, Composition & Theory"

