{{ define "head" }}
<meta name="description" content="CV | {{ .Site.Title }}">
<style>
  .cv-container {
    width: 100%;
    height: 90vh;
    padding: 0;
  }
  .cv-embed {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
{{ end }}

{{ define "title" }}CV | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="container-fluid pt-5">
  <h2 class="text-center pb-3">{{ .Title }}</h2>
  <div class="cv-container">
    <iframe class="cv-embed" src="/cv.pdf" title="Ariana Pereira CV"></iframe>
  </div>
  <div class="text-center pt-3 pb-4">
    <a href="/cv.pdf" download class="btn btn-primary">Download CV</a>
  </div>
</div>
{{ end }}
